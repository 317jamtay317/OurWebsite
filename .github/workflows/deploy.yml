name: Deploy to Azure

# Builds the container image, pushes it to Docker Hub, then provisions/updates the Azure
# infrastructure (Bicep) and rolls the Container App to the new image. Authenticates to Azure with
# OIDC — no stored Azure credentials. See infra/README.md for the one-time setup.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Never let two deploys run at once; queue them instead.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

env:
  IMAGE_REPO: docker.io/jamtay317/promanageronline_website
  RESOURCE_GROUP: rg-promanageronline-prod
  LOCATION: eastus2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: img
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.img.outputs.tag }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none

      - name: Deploy infrastructure
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: infra/main.bicep
          # Secret values are masked by GitHub in logs. Keep secret values free of spaces.
          parameters: >-
            location=${{ env.LOCATION }}
            containerImage=${{ env.IMAGE_REPO }}:${{ steps.img.outputs.tag }}
            dockerHubUsername=${{ secrets.DOCKERHUB_USERNAME }}
            dockerHubToken=${{ secrets.DOCKERHUB_TOKEN }}
            sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
            adminEmail=${{ secrets.ADMIN_EMAIL }}
            adminInitialPassword=${{ secrets.ADMIN_INITIAL_PASSWORD }}
            smtpHost=${{ secrets.SMTP_HOST }}
            smtpUser=${{ secrets.SMTP_USER }}
            smtpPassword=${{ secrets.SMTP_PASSWORD }}
            smtpFromAddress=${{ secrets.SMTP_FROM_ADDRESS }}
            recaptchaSiteKey=${{ secrets.RECAPTCHA_SITE_KEY }}
            recaptchaSecretKey=${{ secrets.RECAPTCHA_SECRET_KEY }}
          failOnStdErr: false

      - name: Summary
        run: |
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ env.IMAGE_REPO }}:${{ steps.img.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.containerAppUrl }}" >> "$GITHUB_STEP_SUMMARY"

# ==========================================================================
# nginx server configuration for the ProManager Online marketing site.
# Copied into /etc/nginx/conf.d/default.conf by the Dockerfile.
# ==========================================================================
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- Compression -------------------------------------------------------
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary       on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml;

    # --- Security headers --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    # 'unsafe-inline' is permitted for styles only (the markup uses a few inline
    # style attributes); scripts are restricted to same-origin files.
    # NOTE: form-action allows formspree.io because the contact form posts there.
    # If you switch form providers, update the form-action directive below.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; form-action 'self' https://formspree.io; base-uri 'self'; frame-ancestors 'self'" always;

    # --- Clean URLs: /about resolves to /about.html ------------------------
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # --- Long-lived caching for static assets ------------------------------
    location /assets/ {
        expires    7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Custom error page -------------------------------------------------
    error_page 404 /404.html;

    # Don't leak the nginx version in error pages / headers.
    server_tokens off;
}
